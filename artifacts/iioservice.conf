description   "Start Chrome OS iio service"
author        "chromium-os-dev@chromium.org"

# Preserve the platform dependency.
start on started mojo_service_manager
stop on stopping mojo_service_manager

expect fork
respawn
respawn limit 10 22

env RESPAWN_DELAY=2

oom score -100
limit as 200000000 unlimited

pre-start script
  # Keep a trace from every boot so boot-time races can be diagnosed.
  exec >>/run/native-iio-prestart.log 2>&1
  set -x

  D=/sys/bus/iio/devices/iio:device2
  DEV=/dev/iio:device2
  ADD=/sys/bus/iio/devices/iio_sysfs_trigger/add_trigger
  P=/usr/local/codex-user/work
  H=/usr/local/sbin/native-iio-boot-fixed

  echo "native-iio pre-start begin: $(date)"

  # Native Ash path owns rotation.
  /sbin/initctl stop duet-autorotate >/dev/null 2>&1 || true

  # The original boot race happens because mojo_service_manager may start
  # before IIO device nodes / sysfs trigger / local files are all ready.
  n=0
  while [ "$n" -lt 60 ]; do
    if [ -x "$H" ] &&
       [ -d "$D" ] &&
       [ -e "$DEV" ] &&
       [ -e "$ADD" ] &&
       [ -r "$P/iio-channel-shim3b.so" ] &&
       [ -r "$P/iio-libwrite-shim2.so" ] &&
       [ -r "$P/libiio.so.0" ]; then
      break
    fi

    # If sysfs trigger support has not appeared yet, try loading it.
    if [ "$n" -eq 5 ] && [ ! -e "$ADD" ]; then
      /usr/bin/modprobe iio-trig-sysfs >/dev/null 2>&1 || true
    fi

    sleep 1
    n=$((n + 1))
  done

  echo "waited ${n}s"

  [ -x "$H" ] || {
    echo "native-iio: helper unavailable"
    exit 1
  }

  [ -d "$D" ] || {
    echo "native-iio: device2 sysfs unavailable"
    exit 1
  }

  [ -e "$DEV" ] || {
    echo "native-iio: /dev/iio:device2 unavailable"
    exit 1
  }

  [ -e "$ADD" ] || {
    echo "native-iio: iio_sysfs_trigger unavailable"
    exit 1
  }

  [ -r "$P/iio-channel-shim3b.so" ] || exit 1
  [ -r "$P/iio-libwrite-shim2.so" ] || exit 1
  [ -r "$P/libiio.so.0" ] || exit 1

  rm -f \
    /run/iio-native-iioservice.log \
    /run/iio-native-iioservice.pid \
    /run/iio-native-started

  # Existing helper is already proven working:
  # - /dev/iio:device2 root:iioservice 660
  # - sysfs permissions
  # - timestamp=0
  # - XYZ enabled
  # - sysfstrig0
  # - buffer preparation
  "$H"

  rc=$?
  echo "native-iio helper rc=$rc"
  exit "$rc"
end script

post-stop script
  trap "exit 0" TERM
  goal=$(status iioservice | awk '{split($2, a, "/"); print a[1]}')
  if [ "${goal}" = "start" ]; then
    sleep "${RESPAWN_DELAY}"
  fi
end script

# One native iioservice owner.
script
  exec runcon u:r:cros_iioservice:s0 /usr/bin/env \
    LD_PRELOAD=/usr/local/codex-user/work/iio-channel-shim3b.so:/usr/local/codex-user/work/iio-libwrite-shim2.so:/usr/local/codex-user/work/libiio.so.0 \
    /sbin/minijail0 \
    --config /usr/share/minijail/iioservice.conf \
    -- /usr/sbin/iioservice
end script
