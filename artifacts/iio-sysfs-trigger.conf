description "Drive the native IIO sysfs trigger for cros-ec-accel"
author "FydeOS native autorotation compatibility"

start on started iioservice
stop on stopping iioservice

respawn
respawn limit 10 60

# Upstart starts this job only after iioservice is started; this gate then
# verifies the fresh log, preload mappings, single-process invariant, and IIO
# state before the adapter is allowed to write trigger_now.
pre-start script
  /usr/local/sbin/native-iio-verify
end script

exec /usr/local/sbin/iio-sysfs-trigger-adapter

